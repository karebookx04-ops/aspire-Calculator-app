<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111111">
<title>Aspire Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111'/%3E%3Cpath d='M14 84 L46 20 H62 L30 84 Z' fill='%23F6F2EA'/%3E%3Cpath d='M54 54 L63 36 L88 84 H70 Z' fill='%23FF4D1A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
:root{--bg:#F4F1EB;--surface:#fff;--ink:#111;--muted:#6A655C;--line:#E6E0D5;--orange:#FF4D1A;--orange-ink:#C2360D;--orange-soft:#FFE6DC;--tile:#F1ECE3;--good:#1E7A46;--good-soft:#DFF2E6;--bad:#C62828;--bad-soft:#FBE3E3;--warn:#9A6A00;--warn-soft:#FBF0D2;--blue:#2E6FD8;--violet:#7B4FE0;
  --side:#111;--side-ink:#CFC9BF;--shadow:0 1px 2px rgb(0 0 0 / .04),0 4px 14px rgb(0 0 0 / .04);
  --display:"Outfit","Noto Sans Devanagari",system-ui,sans-serif;--body:"Inter","Noto Sans Devanagari",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121110;--surface:#1B1917;--ink:#F6F2EA;--muted:#ADA699;--line:#302D29;--tile:#24211E;--orange-ink:#FF8D66;--orange-soft:#3A2017;--good:#5BC88A;--good-soft:#173322;--bad:#FF7A7A;--bad-soft:#3A1A1A;--warn:#E8B64C;--warn-soft:#352A12;--blue:#7AA7F0;--violet:#B39AF5;--side:#0B0A09;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121110;--surface:#1B1917;--ink:#F6F2EA;--muted:#ADA699;--line:#302D29;--tile:#24211E;--orange-ink:#FF8D66;--orange-soft:#3A2017;--good:#5BC88A;--good-soft:#173322;--bad:#FF7A7A;--bad-soft:#3A1A1A;--warn:#E8B64C;--warn-soft:#352A12;--blue:#7AA7F0;--violet:#B39AF5;--side:#0B0A09;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
h1{font-size:26px;letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:16px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.02em;color:#F6F2EA;padding:4px 10px 18px}
.brand svg{width:30px;height:30px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.16em;color:#FF4D1A;text-transform:uppercase;margin-top:2px}
.nav{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--side-ink);padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500;text-align:left;width:100%;text-decoration:none;font-size:14.5px}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:#1F1D1A;color:#fff}
.nav.on{background:#FF4D1A;color:#111;font-weight:700}
.nav .cnt{margin-left:auto;background:#FF4D1A;color:#111;border-radius:999px;font-size:11.5px;font-weight:700;padding:1px 8px}
.nav.on .cnt{background:#111;color:#FF4D1A}
.side .sp{flex:1}
.side .who{font-size:12.5px;padding:10px 12px;color:#8F897F;word-break:break-all}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
main{padding:26px clamp(16px,3vw,36px) 90px;max-width:1240px;width:100%}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.phead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.bnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;background:#111;color:#F6F2EA;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:20}
  .topbar .brand{padding:0;font-size:17px}
  .topbar .brand svg{width:26px;height:26px}
  .topbar .sp{flex:1}
  .topbar .ib{border:0;background:#222;color:#F6F2EA;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;text-decoration:none}
  .topbar .ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  main{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  h1{font-size:22px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;cursor:pointer;position:relative}
  .bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .bnav button.on{color:var(--orange-ink)}
  .bnav .cnt{position:absolute;top:0;left:calc(50% + 6px);background:var(--orange);color:#111;border-radius:999px;font-size:10px;font-weight:800;padding:0 6px;line-height:16px}
}

/* ---------- elements ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.solid{background:var(--orange);border-color:var(--orange);color:#111}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.wa{border-color:#1E9E55;color:#1E9E55}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
label.f{display:grid;gap:6px;font-size:13.5px;font-weight:600;min-width:0}
label.f span.h{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=search],select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--orange);outline:none}
.msg{padding:10px 14px;border-radius:10px;font-size:14px}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.info{background:var(--tile)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.03em;background:var(--tile);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{background:var(--orange-soft);color:var(--orange-ink)}
.s-confirmed{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.s-shipped{background:color-mix(in srgb,var(--violet) 15%,transparent);color:var(--violet)}
.s-delivered{background:var(--good-soft);color:var(--good)}
.s-cancelled{background:var(--tile);color:var(--muted)}
.tag-out{background:var(--bad-soft);color:var(--bad)}
.tag-low{background:var(--warn-soft);color:var(--warn)}
.tag-ok{background:var(--good-soft);color:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;transition:transform .25s,visibility .25s;visibility:hidden;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgb(0 0 0 / .2)}
.toast.show{transform:translate(-50%,0);visibility:visible}
@media (max-width:900px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- login ---------- */
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 500px at 50% -10%,#2a1a12,#111 60%)}
.login{width:100%;max-width:400px}
.login .brand{justify-content:center;padding-bottom:22px}
.login .card{padding:24px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:4px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .l i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--orange-soft);color:var(--orange-ink);font-style:normal}
.kpi .l i svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpi b{font-family:var(--display);font-size:clamp(20px,2.4vw,28px);font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.kpi .d{font-size:12.5px;color:var(--muted)}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.dgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:18px}
@media (max-width:1050px){.dgrid{grid-template-columns:1fr}}
.chart{display:flex;align-items:flex-end;gap:4px;height:210px;padding-top:10px;border-bottom:1.5px solid var(--line);position:relative}
.chart .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:10.5px;color:var(--muted)}
.chart .gl span{position:absolute;left:0;top:-16px;background:var(--surface);padding-right:4px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:default}
.bar i{display:block;background:var(--orange);border-radius:5px 5px 0 0;min-height:2px;transition:filter .15s}
.bar.zero i{background:var(--line)}
.bar:hover i{filter:brightness(.85)}
.bar .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;z-index:3}
.bar:hover .tip,.bar:focus .tip{opacity:1}
.xl{display:flex;gap:4px;margin-top:6px}
.xl span{flex:1;min-width:0;text-align:center;font-size:10.5px;color:var(--muted);overflow:hidden;white-space:nowrap}
.best{display:grid;gap:12px}
.bi{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.bi img,.bi .ni{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--tile)}
.bi .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bi .track{height:6px;background:var(--tile);border-radius:6px;margin-top:6px;overflow:hidden}
.bi .track i{display:block;height:100%;background:var(--orange);border-radius:6px}
.bi .v{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.bi .v b{display:block;font-size:14px}
.alert{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert img,.alert .ni{width:40px;height:40px;border-radius:9px;object-fit:cover;background:var(--tile)}
.rlist{display:grid}
.ritem{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.ritem:hover{background:var(--tile)}
.ritem:last-child{border-bottom:0}
.ritem .no{font:700 13px ui-monospace,Menlo,Consolas,monospace}
@media (max-width:600px){.ritem{grid-template-columns:1fr auto}.ritem .no{grid-column:1/-1}}

/* ---------- orders ---------- */
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-bottom:12px;align-items:center}
@media (max-width:700px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}
.ord{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:12px;margin-bottom:14px;box-shadow:var(--shadow);border-left:5px solid var(--orange)}
.ord[data-s="confirmed"]{border-left-color:var(--blue)}.ord[data-s="shipped"]{border-left-color:var(--violet)}.ord[data-s="delivered"]{border-left-color:var(--good)}.ord[data-s="cancelled"]{border-left-color:var(--line);opacity:.8}
.ord .no{font:700 14px ui-monospace,Menlo,Consolas,monospace}
.ord h3{font-size:17px}
.ord table{width:100%;border-collapse:collapse;font-size:14px}
.ord td{padding:5px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.ord td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px}
.ord .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.ord .acts select{width:auto;padding:6px 10px;font-weight:600}
.ord .ship{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px}
@media (max-width:700px){.ord .ship{grid-template-columns:1fr 1fr}.ord .ship label:last-child{grid-column:1/-1}}
details.wam{position:relative}
details.wam summary{list-style:none}
details.wam summary::-webkit-details-marker{display:none}
details.wam .menu{position:absolute;z-index:15;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgb(0 0 0 / .15);padding:6px;display:grid;min-width:250px}
details.wam .menu a{padding:9px 12px;border-radius:8px;text-decoration:none;font-size:14px}
details.wam .menu a:hover{background:var(--tile)}
details.wam .menu a small{display:block;color:var(--muted);font-size:12px}

/* ---------- customers ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:10px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--orange-soft);color:var(--orange-ink);font-weight:800;font-family:var(--display);flex:none}
.cname{display:flex;gap:10px;align-items:center;min-width:0}
@media (max-width:760px){
  .tbl.resp thead{display:none}
  .tbl.resp,.tbl.resp tbody,.tbl.resp tr,.tbl.resp td{display:block;width:100%}
  .tbl.resp tr{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
  .tbl.resp td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:10px;text-align:right}
  .tbl.resp td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;font-weight:600;text-align:left}
  .tbl.resp td.nolabel::before{display:none}
  .tbl.resp td.nolabel{justify-content:flex-start;text-align:left}
}

/* ---------- products / stock ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pc .im{aspect-ratio:1;background:#F6F2EA;position:relative}
.pc .im img{width:100%;height:100%;object-fit:cover;display:block}
.pc .im .pill{position:absolute;top:10px;left:10px}
.pc .bd{padding:12px 14px;display:grid;gap:6px;flex:1}
.pc .bd b{font-size:14.5px}
.pc .ft{display:flex;gap:8px;padding:0 14px 14px}
.pc .ft .btn{flex:1}
.pc.off{opacity:.6}
.stk{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stk button{border:0;background:none;width:36px;height:38px;font-size:18px;font-weight:700;cursor:pointer}
.stk input{width:70px!important;border:0!important;border-radius:0!important;text-align:center;background:transparent!important;padding:8px 4px!important}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.ph{width:110px;display:grid;gap:6px}
.ph img{width:110px;height:110px;object-fit:cover;border-radius:12px;border:2px solid var(--line);background:#F6F2EA}
.ph.main img{border-color:var(--orange)}
.ph .row{gap:4px}
.addph{width:110px;height:110px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;padding:8px}
.addph:hover{border-color:var(--orange);color:var(--ink)}
.crow{display:grid;grid-template-columns:1fr 54px auto;gap:8px;align-items:center}
.crow input[type=color]{width:54px;height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:3px}
.cprow{display:grid;grid-template-columns:1.2fr .9fr .8fr .8fr .8fr auto;gap:8px;align-items:end}
@media (max-width:760px){.cprow{grid-template-columns:1fr 1fr}}
.sticky-save{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;z-index:5}
@media (max-width:900px){.sticky-save{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgb(0 0 0 / .45);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:18px;max-width:880px;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal .mb{overflow:auto;padding:18px;background:var(--tile)}
.sheet{background:#fff;color:#111;max-width:800px;margin:0 auto;padding:28px;border-radius:6px;box-shadow:0 2px 10px rgb(0 0 0 / .08);font:13px/1.45 var(--body)}

/* ---------- print docs (invoice + slip) ---------- */
.doc{color:#111;font:12.5px/1.45 "Inter",Arial,sans-serif}
.doc h2{font:800 22px "Outfit",Arial,sans-serif;letter-spacing:.02em}
.doc .hd{display:flex;justify-content:space-between;gap:20px;border-bottom:2.5px solid #111;padding-bottom:12px;margin-bottom:12px}

/* ---------- state ---------- */
let auth,db,user=null,ORD=[],PRD=[],SET=null,unsub=[],PAGE="dash",firstOrders=true,seenIds=new Set();

function chartHTML(L,R){
  const n=new Date(); let buckets=[];
  if(R==="12m"){for(let i=11;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);buckets.push({k:d.getFullYear()+"-"+d.getMonth(),l:d.toLocaleDateString("en-IN",{month:"short"}),full:d.toLocaleDateString("en-IN",{month:"long",year:"numeric"}),v:0,c:0})}
    L.forEach(o=>{const d=toD(o.createdAt),b=buckets.find(x=>x.k===d.getFullYear()+"-"+d.getMonth());if(b){b.v+=Number(o.total)||0;b.c++}})}
  else{const days=+R;for(let i=days-1;i>=0;i--){const d=new Date(n);d.setDate(d.getDate()-i);buckets.push({k:d.toDateString(),l:days<=7?d.toLocaleDateString("en-IN",{weekday:"short"}):d.getDate(),full:d.toLocaleDateString("en-IN",{day:"numeric",month:"short"}),v:0,c:0})}
    L.forEach(o=>{const b=buckets.find(x=>x.k===toD(o.createdAt).toDateString());if(b){b.v+=Number(o.total)||0;b.c++}})}
  const max=Math.max(...buckets.map(b=>b.v)); const top=max>0?niceMax(max):1000;
  const every=buckets.length>14?5:1;
  return `<div class="chart">${[1,.5].map(f=>`<div class="gl" style="bottom:${f*100}%"><span>${rs(top*f)}</span></div>`).join("")}
    ${buckets.map(b=>`<div class="bar ${b.v?"":"zero"}" tabindex="0"><i style="height:${b.v?Math.max(2,b.v/top*100):1}%"></i><span class="tip">${b.full}: ${rs(b.v)} · ${b.c} order</span></div>`).join("")}</div>
    <div class="xl">${buckets.map((b,i)=>`<span>${(i%every===0||i===buckets.length-1)?b.l:""}</span>`).join("")}</div>`;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}

/* status change + automatic stock */
const OUT=["confirmed","shipped","delivered"];
async function setStatus(id,next){
  const o=ORD.find(x=>x._id===id); if(!o) return;
  const b=db.batch(), ref=db.collection("store_orders").doc(id), upd={status:next}; let moved="";
  const move=dir=>{const q={};(o.items||[]).forEach(i=>{q[i.id]=(q[i.id]||0)+(Number(i.qty)||0)});
    Object.entries(q).forEach(([pid,n])=>{const p=PRD.find(x=>x.id===pid);if(p&&tracked(p)){b.update(db.collection("store_products").doc(pid),{stock:Math.max(0,p.stock+dir*n)});moved=dir<0?"Stock kam kiya":"Stock wapas joda"}})};
  if(OUT.includes(next)&&!o.stockOut){move(-1);upd.stockOut=true}
  if(next==="cancelled"&&o.stockOut){move(1);upd.stockOut=false}
  if(next==="new"&&o.stockOut){move(1);upd.stockOut=false}
  b.update(ref,upd);
  try{await b.commit();toast("Status: "+stName(next)+(moved?" · "+moved:""))}catch(x){toast(errText(x))}
}
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset.ost){setStatus(el.dataset.ost,el.value);return}
  if(el.dataset.of2){try{await db.collection("store_orders").doc(el.dataset.id).update({[el.dataset.of2]:el.value.trim()});toast("Save ho gaya")}catch(x){toast(errText(x))}return}
  if(el.dataset.stk){saveStock(el.dataset.stk);return}
  if(el.dataset.low){const v=el.value===""?5:Math.max(0,Math.round(+el.value)||0);try{await db.collection("store_products").doc(el.dataset.low).update({lowStock:v});toast("Alert limit save")}catch(x){toast(errText(x))}return}
  if(el.id==="ePhotoIn"&&el.files.length){addPhotos([...el.files]);return}
  if(el.id==="billState"){renderBillModal();return}
});

  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

function billData(o,state){

  const sub=Number(o.sub)||(o.items||[]).reduce((a,i)=>a+i.price*i.qty,0), disc=Number(o.couponAmt)||0;
  const inter=state!=="07";
  const lines=(o.items||[]).map(i=>{const r=rateOf(i), gross=i.price*i.qty, net=gross-(sub?disc*gross/sub:0), taxable=net/(1+r.gst/100), tax=net-taxable;

}

  ${D.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.name)}</td><td>${esc(l.hsn)}</td><td class="r">${l.qty}</td><td class="r">${rs2(l.rate)}</td><td class="r">${rs2(l.taxable)}</td><td class="r">${l.gst}%</td>${D.inter?`<td class="r">${rs2(l.tax)}</td>`:`<td class="r">${rs2(l.tax/2)}</td><td class="r">${rs2(l.tax/2)}</td>`}<td class="r">${rs2(l.net)}</td></tr>`).join("")}
  </tbody></table>
  <div class="two"><div>${o.couponAmt?`<div class="small">Coupon ${esc(o.coupon)} discount of ₹${rs2(o.couponAmt)} is already adjusted in the item amounts.</div>`:""}<div class="lb" style="margin-top:8px">Amount in words</div><b>Rupees ${words(D.total)} Only</b></div>
    <table class="tot"><tr><td>Taxable value</td><td class="r">₹${rs2(D.T.taxable)}</td></tr>${D.inter?`<tr><td>IGST</td><td class="r">₹${rs2(D.T.tax)}</td></tr>`:`<tr><td>CGST</td><td class="r">₹${rs2(D.T.tax/2)}</td></tr><tr><td>SGST</td><td class="r">₹${rs2(D.T.tax/2)}</td></tr>`}${Math.abs(D.round)>=0.01?`<tr><td>Round off</td><td class="r">${D.round>0?"+":"−"}₹${rs2(Math.abs(D.round))}</td></tr>`:""}<tr class="grand"><td>Total</td><td class="r">₹${rs2(D.total)}</td></tr></table></div>
  <div class="ft2"><div class="small" style="color:#555">Prices include GST. Goods once sold can be returned as per our return policy.<br>This is a computer generated invoice.</div><div class="sign"><b>For ${esc(st.firm||"Aspire Enterprises")}</b><div></div>Authorised Signatory</div></div>
  </div>`;
}
function slipHTML(o){
  const st={...billDefaults(),...(SET||{})}, cod=/cash/i.test(o.pay||"");
  return `<div class="doc slip">
  <div class="hd"><div><h2>${esc(st.firm||"Aspire Enterprises")}</h2><div class="small">PACKING SLIP</div></div><div style="text-align:right">Order: <b style="font-size:16px">${esc(o.orderNo)}</b><br>${toD(o.createdAt).toLocaleDateString("en-IN")}</div></div>
  <div class="lb">Ship to</div>
  <div class="to"><b>${esc(o.name)}</b><br>${esc(o.address)}<br>${esc(o.city)} - <b>${esc(o.pin)}</b><br>Mobile: <b>${esc(o.phone)}</b></div>
  <div class="cod">${cod?`COD: COLLECT ${rs(o.total)}`:"PREPAID: DO NOT COLLECT CASH"}</div>
  <table><thead><tr><th>Item</th><th>Colour / Size</th><th class="r">Qty</th><th class="r">✓</th></tr></thead><tbody>
  ${(o.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td>${esc([i.colour,i.size].filter(Boolean).join(", ")||"—")}</td><td class="r"><b>${i.qty}</b></td><td class="r">☐</td></tr>`).join("")}</tbody></table>
  <div class="two" style="margin:12px 0 0"><div class="box2"><div class="lb">From (return address)</div>${esc(st.firm||"Aspire Enterprises")}<br>${esc(st.address||STORE.address)}<br>Phone: ${esc(st.phone||STORE.phone)}</div>
    <div class="box2"><div class="lb">Courier</div>${esc(o.courier||"________________")}<br><div class="lb" style="margin-top:6px">Tracking</div>${esc(o.tracking||"________________")}</div></div>
  </div>`;
}
let BILL=null;
async function openBill(id){
  const o=ORD.find(x=>x._id===id); if(!o) return;
  if(!o.invoiceNo){
    const st={...billDefaults(),...(SET||{})}, pre=st.invPrefix||"AE";
    const nums=ORD.map(x=>x.invoiceNo).filter(x=>x&&x.startsWith(pre)).map(x=>parseInt(x.slice(pre.length))||0);
    const next=Math.max(Number(st.lastInv)||0,...nums,0)+1, no=pre+String(next).padStart(3,"0");
    try{const b=db.batch();b.update(db.collection("store_orders").doc(id),{invoiceNo:no,invoiceDate:new Date()});b.set(db.collection("store_settings").doc("main"),{lastInv:next},{merge:true});await b.commit();o.invoiceNo=no;o.invoiceDate=new Date();toast("Bill number: "+no)}
    catch(e){toast(errText(e));return}
  }
  BILL={id,state:guessState(o)}; renderBillModal();
}
function renderBillModal(){
  const o=ORD.find(x=>x._id===BILL.id); if($("#billState")) BILL.state=$("#billState").value;
  $("#modal").innerHTML=`<div class="box"><div class="mh"><h2>GST bill · ${esc(o.invoiceNo)}</h2><span style="flex:1"></span>
    <label class="row small" style="gap:6px">Place of supply <select id="billState" style="width:auto">${STATES.map(([c,n])=>`<option value="${c}" ${c===BILL.state?"selected":""}>${n} (${c})</option>`).join("")}</select></label>
    <button class="btn solid sm" data-print="bill">${svg("print")}Print / PDF</button><button class="btn sm" data-close>Band karo</button></div>
    <div class="mb"><div class="sheet">${invoiceHTML(o,BILL.state)}</div><p class="small muted" style="max-width:800px;margin:10px auto 0">HSN aur GST % Settings mein badal sakte ho. Rate apne CA se ek baar confirm kar lijiye. Print mein "Save as PDF" chunke PDF bhi bana sakte ho.</p></div></div>`;
  $("#modal").classList.remove("hide");
}
function printDoc(html){$("#printArea").innerHTML=html;setTimeout(()=>window.print(),60)}

/* ---------- clicks ---------- */
let delArm=null;
document.addEventListener("click",async e=>{
  const det=e.target.closest("details.wam"); document.querySelectorAll("details.wam[open]").forEach(d=>{if(d!==det)d.open=false});
  const row=e.target.closest("[data-oq]"); if(row&&!e.target.closest("a")){go("orders");oFilter="all";oRange="all";$("#osearch").value=row.dataset.oq;renderOrders();return}
  const el=e.target.closest("button,a"); if(!el) return;
  if(el.dataset.go){const f=el.dataset.of;go(el.dataset.go);if(f){oFilter=f;renderOrders()}return}
  if(el.hasAttribute("data-logout")){auth.signOut();return}
  if(el.dataset.cr){chartRange=el.dataset.cr;renderDash();return}
  if(el.dataset.of){oFilter=el.dataset.of;renderOrders();return}
  if(el.dataset.ocopy){const o=ORD.find(x=>x._id===el.dataset.ocopy);const txt=`Order ${o.orderNo}\n${(o.items||[]).map(i=>`${i.name} ${[i.colour,i.size].filter(Boolean).join(" ")} x${i.qty} = ${rs(i.price*i.qty)}`).join("\n")}\nTotal ${rs(o.total)} (${o.pay})\n${o.name}, ${o.phone}\n${o.address}, ${o.city} - ${o.pin}`;
    navigator.clipboard?.writeText(txt).then(()=>toast("Copy ho gaya")).catch(()=>toast("Copy nahi hua"));return}
  if(el.dataset.odel){ if(delArm!==el){delArm=el;el.textContent="Pakka? Phir dabaiye";setTimeout(()=>{if(delArm===el){delArm=null;el.textContent="Delete"}},4000);return}
    try{await db.collection("store_orders").doc(el.dataset.odel).delete();toast("Order delete ho gaya")}catch(x){toast(errText(x))}return}
  if(el.dataset.bill){openBill(el.dataset.bill);return}
  if(el.dataset.slip){const o=ORD.find(x=>x._id===el.dataset.slip);printDoc(slipHTML(o));return}
  if(el.dataset.print==="bill"){const o=ORD.find(x=>x._id===BILL.id);printDoc(invoiceHTML(o,$("#billState").value));return}
  if(el.hasAttribute("data-close")){$("#modal").classList.add("hide");return}
  if(el.dataset.sd){const i=document.querySelector(`[data-stk="${el.dataset.sd}"]`);i.value=Math.max(0,(Number(i.value)||0)+Number(el.dataset.d));saveStock(el.dataset.sd);return}
  if(el.hasAttribute("data-pnew")){openEdit(newProduct());return}
  if(el.dataset.pedit){openEdit(PRD.find(p=>p.id===el.dataset.pedit));return}
  if(el.dataset.ptog){const p=PRD.find(x=>x.id===el.dataset.ptog);try{await db.collection("store_products").doc(p.id).update({active:p.active===false});toast(p.active===false?"Website par dikhne laga":"Website se chhup gaya")}catch(x){toast(errText(x))}return}
  if(el.id==="eSave"){saveEdit();return}
  if(el.id==="eColAdd"){readEdit();ED.colours.push({n:"",c:"#7A7F86"});renderEdit();return}
  if(el.dataset.cdel){readEdit();ED.colours.splice(+el.dataset.cdel,1);renderEdit();return}
  if(el.dataset.imain){readEdit();const i=+el.dataset.imain;ED.images.unshift(ED.images.splice(i,1)[0]);renderEdit();return}
  if(el.dataset.idel){readEdit();const im=ED.images.splice(+el.dataset.idel,1)[0];renderEdit();if(ED.id)delPhotoDoc(im);return}
  if(el.id==="eDel"){ if(delArm!==el){delArm=el;el.textContent="Pakka delete? Phir dabaiye";return}
    try{await db.collection("store_products").doc(ED.id).delete();(ED.images||[]).forEach(delPhotoDoc);toast("Product delete ho gaya");go("products")}catch(x){toast(errText(x))}return}
  if(el.id==="sSave"){saveSettings();return}
  if(el.id==="cpAdd"){readSettings();SDRAFT.coupons.push({code:"",type:"pct",value:10,max:0,min:0,en:"",hi:""});renderSettings(true);return}
  if(el.dataset.cpdel){readSettings();SDRAFT.coupons.splice(+el.dataset.cpdel,1);renderSettings(true);return}
  if(el.id==="notifOn"){if(!window.Notification){toast("Is browser mein notification nahi chalta");return}Notification.requestPermission().then(p=>{toast(p==="granted"?"Notification chalu ho gaye":"Notification allow nahi hua");renderSettings(true)});return}
});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")$("#modal").classList.add("hide")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").classList.add("hide")});
window.addEventListener("afterprint",()=>{$("#printArea").innerHTML=""});

/* ---------- SETTINGS ---------- */
let SDRAFT=null, settingsDirty=false;
function renderSettings(keep){
  if(!keep){SDRAFT={...billDefaults(),...JSON.parse(JSON.stringify(SET||settingsFromFile()))}; SDRAFT.coupons=SDRAFT.coupons||[]; settingsDirty=false}
  const s=SDRAFT;
  const f=(id,l,v,type="text",h="")=>`<label class="f">${l}${h?` <span class="h">${h}</span>`:""}<input type="${type}" id="${id}" value="${esc(v??"")}"></label>`;
  const np=window.Notification?Notification.permission:"none";
  $("#settings").innerHTML=`<div class="phead"><div><h1>Settings</h1><p>Dukaan ki jaankari, delivery, coupon aur bill. Save karte hi website par lag jata hai.</p></div></div>
  <div class="stack">
  ${SET?"":`<div class="msg info">Abhi website file wali settings use kar rahi hai. Yahan Save karte hi aapki settings online ho jaayengi.</div>`}
  <div class="card stack"><h3>Dukaan ki jaankari</h3>
    <div class="grid2">${f("sPhone","Phone (dikhane ke liye)",s.phone)}${f("sWa","WhatsApp number",s.whatsapp,"tel","91 + number, bina + ke. Jaise 919990602827")}</div>
    <div class="grid2">${f("sEmail","Email (website par dikhega)",s.email,"email","khaali chhod sakte hain")}${f("sHoursEn","Timing (English)",s.hours_en)}</div>
    ${f("sHoursHi","Timing (Hindi)",s.hours_hi)}
    <label class="f">Address<textarea id="sAddr" rows="2">${esc(s.address)}</textarea></label></div>
  <div class="card stack"><h3>Delivery aur return</h3>
    <div class="grid3">${f("sFree","Free delivery kitne ₹ se",s.freeShipAbove,"number")}${f("sShip","Delivery charge (₹)",s.shipping,"number")}${f("sRet","Return ke din",s.returnDays,"number")}</div>
    <div class="grid2">${f("sDisp","Dispatch kitne din mein",s.dispatchDays,"text","jaise 1-2")}${f("sDel","Delivery kitne din mein",s.deliveryDays,"text","jaise 3-7")}</div></div>
  <div class="card stack"><h3>GST bill</h3><span class="muted small">Bill par yahi details chhapengi. Bill number apne aap ${esc(s.invPrefix||"AE")}001, ${esc(s.invPrefix||"AE")}002... banta hai. GST rate apne CA se confirm kar lijiye.</span>
    <div class="grid3">${f("sFirm","Firm ka naam",s.firm)}${f("sGstin","GSTIN",s.gstin)}${f("sPre","Bill number ki shuruaat",s.invPrefix,"text","jaise AE")}</div>
    <div class="grid2">${f("sHsnB","Bags: HSN",s.hsnBags)}${f("sGstB","Bags: GST %",s.gstBags,"number")}</div>
    <div class="grid2">${f("sHsnC","Covers: HSN",s.hsnCovers)}${f("sGstC","Covers: GST %",s.gstCovers,"number")}</div></div>
  <div class="card stack"><h3>Coupon / Offer</h3><span class="muted small">Pehla coupon website ke upar aur home page par dikhta hai. Type: % chhoot ya seedhe ₹ chhoot.</span>
    ${s.coupons.map((c,i)=>`<div class="stack" style="border-top:1px solid var(--line);padding-top:12px"><div class="cprow">
      <label class="f">Code<input type="text" data-cp="code" data-i="${i}" value="${esc(c.code)}" style="text-transform:uppercase"></label>
      <label class="f">Type<select data-cp="type" data-i="${i}"><option value="pct" ${c.type==="pct"?"selected":""}>% chhoot</option><option value="flat" ${c.type==="flat"?"selected":""}>₹ chhoot</option></select></label>
      <label class="f">Kitni<input type="number" data-cp="value" data-i="${i}" value="${c.value??""}"></label>
      <label class="f">Max ₹ <span class="h">(% ke liye)</span><input type="number" data-cp="max" data-i="${i}" value="${c.max??""}"></label>
      <label class="f">Min order ₹<input type="number" data-cp="min" data-i="${i}" value="${c.min??""}"></label>
      <button class="btn sm danger" data-cpdel="${i}">Hatao</button></div>
      <div class="grid2"><label class="f">Offer ka text (English)<input type="text" data-cp="en" data-i="${i}" value="${esc(c.en)}"></label><label class="f">Offer ka text (Hindi)<input type="text" data-cp="hi" data-i="${i}" value="${esc(c.hi)}"></label></div></div>`).join("")}
    <div><button class="btn sm" id="cpAdd">+ Coupon jodo</button></div></div>
  <div class="card stack"><h3>Naye order ki khabar</h3><span class="muted small">Admin panel khula ho to naya order aate hi awaaz aati hai. Notification chalu karne par screen par bhi message aayega.</span>
    <div class="row">${np==="granted"?`<span class="pill tag-ok">Notification chalu hai</span>`:`<button class="btn sm" id="notifOn">${svg("bell")}Notification chalu karo</button>`}</div></div>
  <div class="card row between"><span class="small muted">Login: <b style="color:var(--ink)">${esc(user&&user.email)}</b></span><button class="btn sm danger" data-logout>Logout</button></div>
  <div id="sMsg"></div>
  <div class="sticky-save"><button class="btn solid" id="sSave">Settings save karo</button></div></div>`;
  $("#settings").oninput=()=>{settingsDirty=true};
}
function readSettings(){
  const v=id=>$("#"+id).value.trim(), n=id=>Number($("#"+id).value)||0;
  Object.assign(SDRAFT,{phone:v("sPhone"),whatsapp:v("sWa").replace(/\D/g,""),email:v("sEmail"),hours_en:v("sHoursEn"),hours_hi:v("sHoursHi"),address:v("sAddr"),
    freeShipAbove:n("sFree"),shipping:n("sShip"),returnDays:n("sRet"),dispatchDays:v("sDisp"),deliveryDays:v("sDel"),
    firm:v("sFirm"),gstin:v("sGstin").toUpperCase(),invPrefix:v("sPre").toUpperCase()||"AE",hsnBags:v("sHsnB"),gstBags:n("sGstB"),hsnCovers:v("sHsnC"),gstCovers:n("sGstC")});
  document.querySelectorAll("[data-cp]").forEach(el=>{const c=SDRAFT.coupons[+el.dataset.i];const k=el.dataset.cp;c[k]=["value","max","min"].includes(k)?(Number(el.value)||0):(k==="code"?el.value.trim().toUpperCase():el.value.trim())});
}
async function saveSettings(){
  readSettings(); const m=$("#sMsg");
  if(SDRAFT.whatsapp&&!/^91\d{10}$/.test(SDRAFT.whatsapp)){m.className="msg bad";m.textContent="WhatsApp number 91 ke saath 12 ankon ka hona chahiye, jaise 919990602827.";return}
  SDRAFT.coupons=SDRAFT.coupons.filter(c=>c.code);
  const d={...SDRAFT}; delete d.lastInv;
  try{await db.collection("store_settings").doc("main").set(d,{merge:true});settingsDirty=false;toast("Settings save ho gayi. Website par lag gayi.");m.className="msg ok";m.textContent="Save ho gaya. Website par turant lag gaya."}catch(e){m.className="msg bad";m.textContent=errText(e)}
}
</script>

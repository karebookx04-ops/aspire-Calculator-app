<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111111">
<title>Aspire Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111'/%3E%3Cpath d='M14 84 L46 20 H62 L30 84 Z' fill='%23F6F2EA'/%3E%3Cpath d='M54 54 L63 36 L88 84 H70 Z' fill='%23FF4D1A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
:root{--bg:#F5F6F8;--surface:#fff;--ink:#14161A;--muted:#667085;--line:#E4E7EC;--orange:#FF4D1A;--orange-ink:#C2360D;--orange-soft:#FFEDE6;--tile:#F2F4F7;--good:#067647;--good-soft:#E3F6EC;--bad:#B42318;--bad-soft:#FDE8E6;--warn:#93600B;--warn-soft:#FDF2D6;--blue:#1D5FD1;--violet:#6941C6;
  --side:#0F1115;--side-ink:#A5ACBA;--shadow:0 1px 2px rgb(16 24 40 / .05);
  --display:"Inter","Noto Sans Devanagari",system-ui,sans-serif;--body:"Inter","Noto Sans Devanagari",system-ui,sans-serif;--brand:"Outfit","Inter",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0C0E11;--surface:#15181D;--ink:#F2F4F7;--muted:#98A2B3;--line:#252A32;--tile:#1C2027;--orange-ink:#FF8D66;--orange-soft:#38200F;--good:#4CC38A;--good-soft:#12301F;--bad:#F97066;--bad-soft:#3A1614;--warn:#F0B84B;--warn-soft:#33270F;--blue:#84ADFF;--violet:#B8A1F8;--side:#090A0D;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C0E11;--surface:#15181D;--ink:#F2F4F7;--muted:#98A2B3;--line:#252A32;--tile:#1C2027;--orange-ink:#FF8D66;--orange-soft:#38200F;--good:#4CC38A;--good-soft:#12301F;--bad:#F97066;--bad-soft:#3A1614;--warn:#F0B84B;--warn-soft:#33270F;--blue:#84ADFF;--violet:#B8A1F8;--side:#090A0D;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;font-weight:700;letter-spacing:-.015em}
h1{font-size:24px}
h2{font-size:16.5px}
h3{font-size:15px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--brand);font-weight:800;font-size:19px;letter-spacing:.02em;color:#F6F2EA;padding:4px 10px 8px}
.brand svg{width:30px;height:30px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.16em;color:#FF4D1A;text-transform:uppercase;margin-top:2px}
.nav{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--side-ink);padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500;text-align:left;width:100%;text-decoration:none;font-size:14.5px}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav{position:relative}
.nav:hover{background:#191C22;color:#fff}
.nav.on{background:#1C2028;color:#fff;font-weight:600}
.nav.on svg{color:#FF4D1A}
.nav.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#FF4D1A}
.nav .cnt{margin-left:auto;background:#FF4D1A;color:#111;border-radius:999px;font-size:11.5px;font-weight:700;padding:1px 8px}

.side .sp{flex:1}
.side .who{font-size:12px;padding:10px 12px;color:#5F6675;word-break:break-all;border-top:1px solid #1C2028;margin-top:6px}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
main{padding:26px clamp(16px,3vw,36px) 90px;max-width:1240px;width:100%}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.phead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.bnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;background:#111;color:#F6F2EA;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:20}
  .topbar .brand{padding:0;font-size:17px}
  .topbar .brand svg{width:26px;height:26px}
  .topbar .sp{flex:1}
  .topbar .ib{border:0;background:#222;color:#F6F2EA;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;text-decoration:none}
  .topbar .ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  main{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  h1{font-size:22px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;cursor:pointer;position:relative}
  .bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .bnav button.on{color:var(--orange-ink)}
  .bnav .cnt{position:absolute;top:0;left:calc(50% + 6px);background:var(--orange);color:#111;border-radius:999px;font-size:10px;font-weight:800;padding:0 6px;line-height:16px}
}

/* ---------- desktop top bar ---------- */
.tb{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px clamp(16px,3vw,36px);min-height:66px}
.tb .crumb{display:grid;line-height:1.2;min-width:0}
.tb .crumb small{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tb .crumb b{font-family:var(--display);font-size:17px}
.gs{position:relative;flex:1;max-width:440px;margin-left:auto}
.gs input{padding-left:38px!important;background:var(--tile);box-shadow:none;border-color:transparent}
.gs>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgb(0 0 0 / .16);padding:6px;z-index:40;max-height:70vh;overflow:auto}
.gres h4{margin:8px 10px 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gres button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;font-size:14px}
.gres button:hover,.gres button:focus{background:var(--tile)}
.gres button span{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap}
.tbi{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:8px;box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;position:relative;flex:none;color:var(--ink)}
.tbi svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tbi .cnt{position:absolute;top:-6px;right:-6px;background:var(--orange);color:#111;border-radius:999px;font-size:10.5px;font-weight:800;padding:0 6px;line-height:18px;border:2px solid var(--surface)}
.langsel{width:auto!important;padding:8px 10px!important;font-weight:600;font-size:13.5px}
.me{display:flex;align-items:center;gap:10px;padding-left:4px}
.me .av{width:38px;height:38px}
.me .nm{display:grid;line-height:1.2;font-size:13px;max-width:170px}
.me .nm small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1180px){.me .nm{display:none}}
@media (max-width:900px){.tb{display:none}}
.sgl{font-size:10.5px;letter-spacing:.14em;color:#5F6675;padding:16px 12px 6px;text-transform:uppercase;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--muted)}
.seg button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg button.on{background:var(--ink);color:var(--bg)}
@media (max-width:900px){.seg.views{display:none}}
.otbl{width:100%;border-collapse:collapse;font-size:14px}
.otbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:12px 14px;background:var(--tile);white-space:nowrap}
.otbl td{padding:13px 14px;border-top:1px solid var(--line);vertical-align:middle}
.otbl .orow{cursor:pointer}
.otbl .orow:hover td{background:color-mix(in srgb,var(--tile) 60%,transparent)}
.otbl .orow.open td{background:var(--tile)}
.otbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.otbl .no{font:700 13px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.otbl .chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .15s}
.otbl .orow.open .chev{transform:rotate(180deg)}
.otbl .odet>td{padding:0 14px 14px;background:var(--tile);border-top:0}
.otbl .odet .ord{margin:0;box-shadow:none}
.sbar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--tile);margin:6px 0 14px}
.sbar i{display:block;height:100%}
.leg{display:grid;gap:8px}
.leg div{display:flex;align-items:center;gap:10px;font-size:14px}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg b{margin-left:auto;font-variant-numeric:tabular-nums}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:26px 0 0}
[data-lang="hi"] .sgl,[data-lang="hi"] .brand small,[data-lang="hi"] .crumb small,[data-lang="hi"] th,[data-lang="hi"] .gres h4,[data-lang="hi"] .pill{letter-spacing:0!important}
/* ---------- elements ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;box-shadow:var(--shadow);cursor:pointer;text-decoration:none;white-space:nowrap;font-size:14px}
.btn:hover{background:var(--tile)}
.btn.solid:hover{background:#E8410F}.btn.dark:hover{background:var(--ink);opacity:.9}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.solid{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:7px}
.btn.wa{border-color:#1E9E55;color:#1E9E55}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600;min-width:0;align-content:start}
label.f span.h{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0;box-shadow:var(--shadow)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 18%,transparent)}
.msg{padding:10px 14px;border-radius:10px;font-size:14px}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.info{background:var(--tile)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.03em;background:var(--tile);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{background:var(--orange-soft);color:var(--orange-ink)}
.s-confirmed{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.s-shipped{background:color-mix(in srgb,var(--violet) 15%,transparent);color:var(--violet)}
.s-delivered{background:var(--good-soft);color:var(--good)}
.s-cancelled{background:var(--tile);color:var(--muted)}
.tag-out{background:var(--bad-soft);color:var(--bad)}
.tag-low{background:var(--warn-soft);color:var(--warn)}
.tag-ok{background:var(--good-soft);color:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:#14161A;color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;transition:transform .25s,visibility .25s;visibility:hidden;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgb(0 0 0 / .2)}
.toast.show{transform:translate(-50%,0);visibility:visible}
@media (max-width:900px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- login ---------- */
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#0F1115}
.login{width:100%;max-width:400px}
.login .brand{justify-content:center;padding-bottom:22px}
.login .card{padding:24px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);display:grid;gap:4px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .l i{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--orange-soft);color:var(--orange-ink);font-style:normal}
.kpi .l i svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpi b{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:clamp(20px,2.3vw,28px);font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.kpi .d{font-size:12.5px;color:var(--muted)}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.dgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:18px}
@media (max-width:1050px){.dgrid{grid-template-columns:1fr!important}}
.chart{display:flex;align-items:flex-end;gap:4px;height:210px;margin-top:26px;border-bottom:1.5px solid var(--line);position:relative}
.chart .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:10.5px;color:var(--muted)}
.chart .gl span{position:absolute;left:0;top:-16px;background:var(--surface);padding-right:4px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:default}
.bar i{display:block;background:var(--orange);border-radius:4px 4px 0 0;min-height:2px;transition:filter .15s}
.bar.zero i{background:var(--line)}
.bar:hover i{filter:brightness(.85)}
.bar .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;z-index:3}
.bar:hover .tip,.bar:focus .tip{opacity:1}
.xl{display:flex;gap:4px;margin-top:6px}
.xl span{flex:1;min-width:0;text-align:center;font-size:10.5px;color:var(--muted);overflow:hidden;white-space:nowrap}
.best{display:grid;gap:12px}
.bi{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.bi img,.bi .ni{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--tile)}
.bi .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bi .track{height:6px;background:var(--tile);border-radius:6px;margin-top:6px;overflow:hidden}
.bi .track i{display:block;height:100%;background:var(--orange);border-radius:6px}
.bi .v{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.bi .v b{display:block;font-size:14px}
.alert{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert img,.alert .ni{width:40px;height:40px;border-radius:9px;object-fit:cover;background:var(--tile)}
.rlist{display:grid}
.ritem{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.ritem:hover{background:var(--tile)}
.ritem:last-child{border-bottom:0}
.ritem .no{font:700 13px ui-monospace,Menlo,Consolas,monospace}
@media (max-width:600px){.ritem{grid-template-columns:1fr auto}.ritem .no{grid-column:1/-1}}

/* ---------- dashboard v4 ---------- */
.hero{position:relative;overflow:hidden;border-radius:16px;padding:26px 28px;margin-bottom:18px;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;border:1px solid rgb(255 255 255 / .06);
  background:radial-gradient(520px 260px at 92% -30%,rgb(255 77 26 / .55),transparent 70%),radial-gradient(380px 220px at 4% 140%,rgb(255 77 26 / .2),transparent 70%),linear-gradient(135deg,#1B1E25,#0F1115)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgb(255 255 255 / .045) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255 / .045) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:linear-gradient(90deg,transparent 35%,#000);mask-image:linear-gradient(90deg,transparent 35%,#000)}
.hero>*{position:relative;z-index:1}
.hero .hx{min-width:0;flex:1 1 380px}
.hero .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#FF8D66}
.hero h1{font-size:clamp(22px,2.6vw,30px);margin:8px 0 6px;color:#fff;letter-spacing:-.02em}
.hero p{margin:0;color:#C3C8D2;font-size:14.5px}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.hb{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid rgb(255 255 255 / .18);background:rgb(255 255 255 / .08);color:#fff;border-radius:9px;padding:9px 14px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.hb:hover{background:rgb(255 255 255 / .16)}
.hb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hb.pri{background:var(--orange);border-color:var(--orange)}
.hb.pri:hover{background:#E8410F}
[data-lang="hi"] .hero .eyebrow,[data-lang="hi"] .demo-b b,[data-lang="hi"] .dnl{letter-spacing:0!important}

.kpi{position:relative;gap:6px;grid-template-rows:auto auto 1fr;transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgb(16 24 40 / .09)}
.kpi .kb{align-self:end;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:34px}
.kpi .d{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.spark{width:96px;height:34px;flex:none}
.dl{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;font-weight:700;font-size:11.5px;white-space:nowrap}
.dl.up{background:var(--good-soft);color:var(--good)}
.dl.down{background:var(--bad-soft);color:var(--bad)}
.dl.warnp{background:var(--orange-soft);color:var(--orange-ink)}
.kpi.accent{background:linear-gradient(135deg,#FF5A26,#DB3A0B);border-color:transparent;color:#fff;box-shadow:0 10px 26px rgb(255 77 26 / .28)}
.kpi.accent .l,.kpi.accent .d{color:rgb(255 255 255 / .92)}
.kpi.accent .l i{background:rgb(255 255 255 / .22);color:#fff}
.kpi.accent .dl{background:rgb(255 255 255 / .24);color:#fff}

.achart{display:grid;grid-template-columns:46px 1fr;column-gap:10px;margin-top:14px}
.yax{position:relative;height:240px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.yax span{position:absolute;right:0;transform:translateY(-50%);line-height:1;white-space:nowrap}
.plot{position:relative;height:240px;border-bottom:1.5px solid var(--line)}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gl2{stroke:var(--line);stroke-width:1;stroke-dasharray:4 5}
.ln{fill:none;stroke:var(--orange);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.cols{position:absolute;inset:0;display:flex}
.col{flex:1;min-width:0;position:relative;outline:none}
.col::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--muted);opacity:0}
.col i{position:absolute;left:50%;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--orange);transform:translate(-50%,50%);opacity:0;box-shadow:0 2px 6px rgb(0 0 0 / .18)}
.col .tip{position:absolute;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;z-index:3;display:grid;line-height:1.35;box-shadow:0 8px 20px rgb(0 0 0 / .18)}
.col .tip b{font-size:13.5px}
.col.tl .tip{left:0;transform:none}
.col.tr .tip{left:auto;right:0;transform:none}
.col:hover::before,.col:focus::before{opacity:.45}
.col:hover i,.col:focus i,.col:hover .tip,.col:focus .tip{opacity:1}
.achart .xl{grid-column:2;gap:0;margin-top:8px}
.achart .xl span{display:flex;justify-content:center;overflow:visible}
.achart.empty{display:block;position:relative;min-height:262px}
.achart.empty>svg{position:absolute;inset:0;width:100%;height:100%}
.achart.empty .es{position:relative;min-height:262px}

.es{display:grid;justify-items:center;align-content:center;gap:5px;text-align:center;padding:22px 16px;color:var(--muted);min-height:200px}
.es i{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--orange-soft);color:var(--orange-ink);margin-bottom:8px;font-style:normal}
.es i svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.es b{color:var(--ink);font-size:15px}
.es>span{font-size:13.5px;max-width:320px}
.es .btn{margin-top:10px}

.dcol{display:flex;flex-direction:column}
.dcol>.dn-wrap,.dcol>.es{margin:auto 0}
.dn-wrap{display:grid;grid-template-columns:168px 1fr;gap:22px;align-items:center;padding:6px 0}
.donut{width:168px;height:168px;display:block}
.dnn{font:700 8.5px var(--display);fill:var(--ink)}
.dnl{font:600 2.9px var(--body);fill:var(--muted);letter-spacing:.25px;text-transform:uppercase}
.leg span.small{width:38px;text-align:right}
@media (max-width:420px){.dn-wrap{grid-template-columns:1fr;justify-items:center}.dn-wrap .leg{width:100%}}

.setup{margin-bottom:18px;border-top:3px solid var(--orange)}
.pbar{width:170px;height:8px;border-radius:8px;background:var(--tile);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--orange);border-radius:8px;min-width:8px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.step{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;justify-items:start;min-width:0}
.step>div{display:grid;gap:3px;align-content:start}
.step b{font-size:14px;line-height:1.3}
.step>div span{font-size:12.5px;color:var(--muted)}
.sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px}
.sn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.step.ok{background:var(--tile);border-color:transparent}
.step.ok .sn{background:var(--good);color:#fff}
.step.ok b{color:var(--muted)}
@media (max-width:1180px){.steps{grid-template-columns:1fr;gap:8px}.step{grid-template-columns:auto 1fr auto;grid-template-rows:auto;align-items:center;padding:10px 12px}}
@media (max-width:520px){.step{grid-template-columns:auto 1fr}.step>.btn,.step>.pill{grid-column:2;justify-self:start}}

.demo-b{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border:1px dashed currentColor;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.demo-b b{margin-right:6px;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.demo-b .btn{color:var(--ink)}

.rsub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--tile);font-weight:700;font-size:12.5px;color:var(--muted)}
.ritem .av{background:var(--orange-soft);color:var(--orange-ink);border-color:transparent}
.ritem:not([data-oq]){cursor:default}
@media (max-width:600px){
  .hero{padding:20px 18px}
  .qa{width:100%}
  .hb{flex:1 1 auto}
  .ritem{grid-template-columns:1fr auto auto!important;gap:10px}
  .ritem .av{display:none}
  .kpi{padding:14px}
  .kpi .kb{flex-direction:column;align-items:stretch;gap:6px}
  .spark{width:100%}
  .achart{grid-template-columns:38px 1fr;column-gap:6px}
  .yax{font-size:10px}
}

/* ---------- orders ---------- */
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-bottom:12px;align-items:center}
@media (max-width:700px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}
.ord{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;gap:12px;margin-bottom:14px;box-shadow:var(--shadow);border-left:3px solid var(--orange)}
.ord[data-s="confirmed"]{border-left-color:var(--blue)}.ord[data-s="shipped"]{border-left-color:var(--violet)}.ord[data-s="delivered"]{border-left-color:var(--good)}.ord[data-s="cancelled"]{border-left-color:var(--line);opacity:.8}
.ord .no{font:700 14px ui-monospace,Menlo,Consolas,monospace}
.ord h3{font-size:17px}
.ord table{width:100%;border-collapse:collapse;font-size:14px}
.ord td{padding:5px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.ord td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px}
.ord .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.ord .acts select{width:auto;padding:6px 10px;font-weight:600}
.ord .ship{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px;align-items:end}
@media (max-width:700px){.ord .ship{grid-template-columns:1fr 1fr}.ord .ship label:last-child{grid-column:1/-1}}
details.wam{position:relative}
details.wam summary{list-style:none}
details.wam summary::-webkit-details-marker{display:none}
details.wam .menu{position:absolute;z-index:15;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgb(0 0 0 / .15);padding:6px;display:grid;min-width:250px}
details.wam .menu a{padding:9px 12px;border-radius:8px;text-decoration:none;font-size:14px}
details.wam .menu a:hover{background:var(--tile)}
details.wam .menu a small{display:block;color:var(--muted);font-size:12px}

/* ---------- customers ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:10px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--tile);color:var(--ink);border:1px solid var(--line);font-weight:700;font-size:13.5px;flex:none}
.cname{display:flex;gap:10px;align-items:center;min-width:0}
@media (max-width:760px){
  .tbl.resp thead{display:none}
  .tbl.resp,.tbl.resp tbody,.tbl.resp tr,.tbl.resp td{display:block;width:100%}
  .tbl.resp tr{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
  .tbl.resp td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:10px;text-align:right}
  .tbl.resp td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;font-weight:600;text-align:left}
  .tbl.resp td.nolabel::before{display:none}
  .tbl.resp td.nolabel{justify-content:flex-start;text-align:left}
}

/* ---------- products / stock ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pc .im{aspect-ratio:1;background:#F6F2EA;position:relative;border-bottom:1px solid var(--line)}
.pc .im img{width:100%;height:100%;object-fit:cover;display:block}
.pc .im .pill{position:absolute;top:10px;left:10px}
.pc .bd{padding:12px 14px;display:grid;gap:6px;flex:1}
.pc .bd b{font-size:14.5px}
.pc .ft{display:flex;gap:8px;padding:0 14px 14px}
.pc .ft .btn{flex:1}
.pc.off{opacity:.6}
.stk{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.stk button{border:0;background:none;width:36px;height:38px;font-size:18px;font-weight:700;cursor:pointer}
.stk input{width:70px!important;border:0!important;border-radius:0!important;text-align:center;background:transparent!important;padding:8px 4px!important;box-shadow:none!important}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.ph{width:110px;display:grid;gap:6px}
.ph img{width:110px;height:110px;object-fit:cover;border-radius:12px;border:2px solid var(--line);background:#F6F2EA}
.ph.main img{border-color:var(--orange)}
.ph .row{gap:4px}
.addph{width:110px;height:110px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;padding:8px}
.addph:hover{border-color:var(--orange);color:var(--ink)}
.crow{display:grid;grid-template-columns:1fr 54px auto;gap:8px;align-items:center}
.crow input[type=color]{width:54px;height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:3px}
.cprow{display:grid;grid-template-columns:1.2fr .9fr .8fr .8fr .8fr auto;gap:8px;align-items:end}
@media (max-width:760px){.cprow{grid-template-columns:1fr 1fr}}
.sticky-save{position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;z-index:5}
@media (max-width:900px){.sticky-save{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgb(0 0 0 / .45);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;max-width:880px;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal .mb{overflow:auto;padding:18px;background:var(--tile)}
.sheet{background:#fff;color:#111;max-width:800px;margin:0 auto;padding:28px;border-radius:6px;box-shadow:0 2px 10px rgb(0 0 0 / .08);font:13px/1.45 var(--body)}

/* ---------- print docs (invoice + slip) ---------- */
.doc{color:#111;font:12.5px/1.45 "Inter",Arial,sans-serif}
.doc h2{font:800 22px "Outfit",Arial,sans-serif;letter-spacing:.02em}
.doc .hd{display:flex;justify-content:space-between;gap:20px;border-bottom:2.5px solid #111;padding-bottom:12px;margin-bottom:12px}
.doc .ttl{font:800 15px "Outfit",Arial,sans-serif;letter-spacing:.12em;text-align:right;color:#C2360D}
.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px}
.doc .box2{border:1px solid #ccc;border-radius:6px;padding:10px 12px}
.doc .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#666;font-weight:700;margin-bottom:3px}
.doc table{width:100%;border-collapse:collapse;margin-bottom:10px}
.doc th{background:#111;color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:6px 6px;text-align:left}
.doc td{padding:6px;border-bottom:1px solid #ddd;vertical-align:top}
.doc .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc .tot td{border:0;padding:3px 6px}
.doc .grand td{font-weight:800;font-size:14px;border-top:2px solid #111;padding-top:6px}
.doc .ft2{display:flex;justify-content:space-between;gap:20px;margin-top:18px;align-items:flex-end}
.doc .sign{text-align:right;min-width:200px}
.doc .sign div{height:44px}
.slip{border:2px dashed #111;border-radius:8px;padding:18px}
.slip .to{font-size:17px;line-height:1.4}
.slip .to b{font-size:21px}
.slip .cod{border:3px solid #111;border-radius:8px;padding:10px 14px;font:800 20px "Outfit",Arial,sans-serif;text-align:center;margin:14px 0}
#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .slip{page-break-inside:avoid}
}
</style>

function chartHTML(L,R){

  else{const days=+R;for(let i=days-1;i>=0;i--){const d=new Date(n);d.setDate(d.getDate()-i);buckets.push({k:d.toDateString(),l:days<=7?d.toLocaleDateString(LOC(),{weekday:"short"}):d.getDate(),full:d.toLocaleDateString(LOC(),{day:"numeric",month:"short"}),v:0,c:0})}
    L.forEach(o=>{const b=buckets.find(x=>x.k===toD(o.createdAt).toDateString());if(b){b.v+=Number(o.total)||0;b.c++}})}
  const max=Math.max(...buckets.map(b=>b.v)), N=buckets.length;
  if(max<=0) return `<div class="achart empty"><svg viewBox="0 0 1000 240" preserveAspectRatio="none" aria-hidden="true"><path d="M0 200 C120 190 160 150 260 160 C360 170 400 110 500 120 C600 130 640 70 740 85 C840 100 900 40 1000 30" fill="none" style="stroke:var(--line)" stroke-width="3" stroke-dasharray="8 10" vector-effect="non-scaling-stroke"/></svg>
    ${esHTML("avg","Abhi koi bikri nahi","Pehla order aate hi yahan bikri ka chart banega.",REALN<10&&!DEMO?`<button class="btn sm" data-demo="1">Demo data dekho</button>`:"")}</div>`;
  const top=niceMax(max), W=1000, H=240, x=i=>(i+.5)/N*W, y=v=>H-(v/top)*(H-6);
  const pts=buckets.map((b,i)=>[x(i),y(b.v)]);
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<N;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],mx=((x0+x1)/2).toFixed(1);d+=` C${mx} ${y0.toFixed(1)} ${mx} ${y1.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`}
  const every=N>14?5:1;
  return `<div class="achart"><div class="yax">${[1,.75,.5,.25,0].map(f=>`<span style="top:${((1-f*(H-6)/H)*100).toFixed(2)}%">${rsK(top*f)}</span>`).join("")}</div>
    <div class="plot"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF4D1A" stop-opacity=".3"/><stop offset="1" stop-color="#FF4D1A" stop-opacity="0"/></linearGradient></defs>
      ${[.25,.5,.75,1].map(f=>`<line x1="0" x2="${W}" y1="${(H-f*(H-6)).toFixed(1)}" y2="${(H-f*(H-6)).toFixed(1)}" class="gl2" vector-effect="non-scaling-stroke"/>`).join("")}
      <path d="${d} L${pts[N-1][0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z" fill="url(#ag)"/><path d="${d}" class="ln" vector-effect="non-scaling-stroke"/></svg>
      <div class="cols">${buckets.map((b,i)=>`<div class="col ${i<N*.18?"tl":i>N*.82?"tr":""}" tabindex="0"><i style="bottom:${(b.v/top*(H-6)/H*100).toFixed(2)}%"></i><span class="tip" style="bottom:min(calc(${(b.v/top*(H-6)/H*100).toFixed(2)}% + 14px),calc(100% - 46px))"><b>${rs(b.v)}</b>${b.full} · ${b.c} order</span></div>`).join("")}</div></div>
    <div class="xl">${buckets.map((b,i)=>`<span>${(i%every===0||i===N-1)?b.l:""}</span>`).join("")}</div></div>`;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}

/* status change + automatic stock */
const OUT=["confirmed","shipped","delivered"];
async function setStatus(id,next){
  const o=ORD.find(x=>x._id===id); if(!o) return;
  const b=db.batch(), ref=db.collection("store_orders").doc(id), upd={status:next}; let moved="";
  const move=dir=>{const q={};(o.items||[]).forEach(i=>{q[i.id]=(q[i.id]||0)+(Number(i.qty)||0)});
    Object.entries(q).forEach(([pid,n])=>{const p=PRD.find(x=>x.id===pid);if(p&&tracked(p)){b.update(db.collection("store_products").doc(pid),{stock:Math.max(0,p.stock+dir*n)});moved=dir<0?"Stock kam kiya":"Stock wapas joda"}})};
  if(OUT.includes(next)&&!o.stockOut){move(-1);upd.stockOut=true}
  if(next==="cancelled"&&o.stockOut){move(1);upd.stockOut=false}
  if(next==="new"&&o.stockOut){move(1);upd.stockOut=false}
  b.update(ref,upd);
  try{await b.commit();toast("Status: "+stName(next)+(moved?" · "+moved:""))}catch(x){toast(errText(x))}
}
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset.ost){setStatus(el.dataset.ost,el.value);return}
  if(el.dataset.of2){try{await db.collection("store_orders").doc(el.dataset.id).update({[el.dataset.of2]:el.value.trim()});toast("Save ho gaya")}catch(x){toast(errText(x))}return}
  if(el.dataset.stk){saveStock(el.dataset.stk);return}
  if(el.dataset.phsn!==undefined&&el.dataset.phsn){try{await db.collection("store_products").doc(el.dataset.phsn).update({hsn:el.value.trim()});toast("HSN save ho gaya")}catch(x){toast(errText(x))}return}
  if(el.dataset.pgst){const v=el.value.trim();try{await db.collection("store_products").doc(el.dataset.pgst).update({gst:v===""?null:Math.max(0,+v||0)});toast("GST % save ho gaya")}catch(x){toast(errText(x))}return}
  if(el.dataset.low){const v=el.value===""?5:Math.max(0,Math.round(+el.value)||0);try{await db.collection("store_products").doc(el.dataset.low).update({lowStock:v});toast("Alert limit save")}catch(x){toast(errText(x))}return}
  if(el.id==="ePhotoIn"&&el.files.length){addPhotos([...el.files]);return}
  if(el.id==="billState"){renderBillModal();return}
});

function downloadCSV(name,rows){
  const csv=rows.map(r=>r.map(c=>{const s=String(c??"");return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

function words(n){
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?" "+a[x%10]:""), three=x=>(x>=100?a[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?two(x%100):"");
  n=Math.round(n); if(!n) return "Zero"; let s="";
  const cr=Math.floor(n/1e7);n%=1e7;const l=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;

}
function billData(o,state){
  const st={...billDefaults(),...(SET||{})};
  const rateOf=i=>{const p=PRD.find(x=>x.id===i.id)||{};const cat=p.cat||(String(i.name).match(/cover/i)?"covers":"bags");
    return {hsn:p.hsn||(cat==="covers"?st.hsnCovers:st.hsnBags),gst:typeof p.gst==="number"?p.gst:Number(cat==="covers"?st.gstCovers:st.gstBags)}};
  const sub=Number(o.sub)||(o.items||[]).reduce((a,i)=>a+i.price*i.qty,0), disc=Number(o.couponAmt)||0;
  const inter=state!=="07";
  const lines=(o.items||[]).map(i=>{const r=rateOf(i), gross=i.price*i.qty, net=gross-(sub?disc*gross/sub:0), taxable=net/(1+r.gst/100), tax=net-taxable;
    return {name:i.name+([i.colour,i.size].filter(Boolean).length?" ("+[i.colour,i.size].filter(Boolean).join(", ")+")":""),hsn:r.hsn,qty:i.qty,rate:taxable/i.qty,taxable,gst:r.gst,tax,net}});
  if(Number(o.ship)){const g=Math.max(0,...lines.map(l=>l.gst)),net=Number(o.ship),taxable=net/(1+g/100);lines.push({name:"Delivery charges",hsn:"9965",qty:1,rate:taxable,taxable,gst:g,tax:net-taxable,net})}
  const T={taxable:lines.reduce((a,l)=>a+l.taxable,0),tax:lines.reduce((a,l)=>a+l.tax,0)};
  const exact=T.taxable+T.tax, total=Number(o.total)||exact;
  return {st,lines,T,inter,total,round:total-exact,state};
}

    +(cs.length?`<h4>Customers</h4>`+cs.map(c=>`<button data-gp="c" data-gv="${esc(p10(c.phone))}">${esc(c.name)}<span>${esc(c.phone)} · ${c.orders} order</span></button>`).join(""):"")
    +(ps.length?`<h4>Products</h4>`+ps.map(p=>`<button data-gp="p" data-gv="${esc(p.id)}">${esc(p.name)}<span>${rs(p.price)}</span></button>`).join(""):"")
    ||`<div class="empty small">Kuch nahi mila</div>`;
  box.classList.remove("hide");
});
$("#gq").addEventListener("keydown",e=>{if(e.key==="Escape"){$("#gres").classList.add("hide");$("#gq").blur()}if(e.key==="Enter"){const b=$("#gres button");if(b)b.click()}});
document.addEventListener("click",e=>{if(!e.target.closest(".gs"))$("#gres").classList.add("hide")});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")$("#modal").classList.add("hide")});

/* ---------- SETTINGS ---------- */
let SDRAFT=null, settingsDirty=false;
function renderSettings(keep){
  if(!keep){SDRAFT={...billDefaults(),...JSON.parse(JSON.stringify(SET||settingsFromFile()))}; SDRAFT.coupons=SDRAFT.coupons||[]; settingsDirty=false}
  const s=SDRAFT;
  const f=(id,l,v,type="text",h="")=>`<label class="f">${l}${h?` <span class="h">${h}</span>`:""}<input type="${type}" id="${id}" value="${esc(v??"")}"></label>`;
  const np=window.Notification?Notification.permission:"none";
  $("#settings").innerHTML=`<div class="phead"><div><h1>Settings</h1><p>Dukaan ki jaankari, delivery, coupon aur bill. Save karte hi website par lag jata hai.</p></div></div>
  <div class="stack">
  ${SET?"":`<div class="msg info">Abhi website file wali settings use kar rahi hai. Yahan Save karte hi aapki settings online ho jaayengi.</div>`}
  <div class="card stack"><h3>Dukaan ki jaankari</h3>
    <div class="grid2">${f("sPhone","Phone (dikhane ke liye)",s.phone)}${f("sWa","WhatsApp number",s.whatsapp,"tel","91 + number, bina + ke. Jaise 919990602827")}</div>
    <div class="grid2">${f("sEmail","Email (website par dikhega)",s.email,"email","khaali chhod sakte hain")}${f("sHoursEn","Timing (English)",s.hours_en)}</div>
    ${f("sHoursHi","Timing (Hindi)",s.hours_hi)}
    <label class="f">Address<textarea id="sAddr" rows="2">${esc(s.address)}</textarea></label></div>
  <div class="card stack"><h3>Delivery aur return</h3>
    <div class="grid3">${f("sFree","Free delivery kitne ₹ se",s.freeShipAbove,"number")}${f("sShip","Delivery charge (₹)",s.shipping,"number")}${f("sRet","Return ke din",s.returnDays,"number")}</div>
    <div class="grid2">${f("sDisp","Dispatch kitne din mein",s.dispatchDays,"text","jaise 1-2")}${f("sDel","Delivery kitne din mein",s.deliveryDays,"text","jaise 3-7")}</div></div>
  <div class="card stack"><h3>GST bill</h3><span class="muted small">Bill par yahi details chhapengi. Bill number apne aap ${esc(s.invPrefix||"AE")}001, ${esc(s.invPrefix||"AE")}002... banta hai. Neeche category ka GST % bharo, aur kisi product ka alag ho to "Har product ka GST %" mein bharo.</span>
    <div class="grid3">${f("sFirm","Firm ka naam",s.firm)}${f("sGstin","GSTIN",s.gstin)}${f("sPre","Bill number ki shuruaat",s.invPrefix,"text","jaise AE")}</div>
    <div class="grid2">${f("sHsnB","Bags: HSN",s.hsnBags)}${f("sGstB","Bags: GST %",s.gstBags,"number")}</div>
    <div class="grid2">${f("sHsnC","Covers: HSN",s.hsnCovers)}${f("sGstC","Covers: GST %",s.gstCovers,"number")}</div></div>
  ${PRD.length?`<div class="card stack"><h3>Har product ka GST % aur HSN</h3><span class="muted small">Yahan har product ka GST % aur HSN code bharo. Khaali chhodoge to upar wala category ka rate lagega. Badalte hi save ho jata hai.</span>
    <table class="tbl resp"><thead><tr><th>Product</th><th>Category</th><th>HSN</th><th>GST %</th></tr></thead><tbody>
    ${PRD.map(p=>`<tr><td class="nolabel"><b>${esc(p.name)}</b></td><td data-l="Category">${p.cat==="covers"?"Covers":"Bags"}</td><td data-l="HSN"><input type="text" data-phsn="${p.id}" value="${esc(p.hsn||"")}" placeholder="${esc(p.cat==="covers"?s.hsnCovers:s.hsnBags)}" style="width:110px"></td><td data-l="GST %"><input type="number" min="0" max="28" step="0.1" data-pgst="${p.id}" value="${typeof p.gst==="number"?p.gst:""}" placeholder="${p.cat==="covers"?s.gstCovers:s.gstBags}" style="width:90px"></td></tr>`).join("")}
    </tbody></table></div>`:""}
  <div class="card stack"><h3>Coupon / Offer</h3><span class="muted small">Pehla coupon website ke upar aur home page par dikhta hai. Type: % chhoot ya seedhe ₹ chhoot.</span>
    ${s.coupons.map((c,i)=>`<div class="stack" style="border-top:1px solid var(--line);padding-top:12px"><div class="cprow">
      <label class="f">Code<input type="text" data-cp="code" data-i="${i}" value="${esc(c.code)}" style="text-transform:uppercase"></label>
      <label class="f">Type<select data-cp="type" data-i="${i}"><option value="pct" ${c.type==="pct"?"selected":""}>% chhoot</option><option value="flat" ${c.type==="flat"?"selected":""}>₹ chhoot</option></select></label>
      <label class="f">Kitni<input type="number" data-cp="value" data-i="${i}" value="${c.value??""}"></label>
      <label class="f">Max ₹ <span class="h">(% ke liye)</span><input type="number" data-cp="max" data-i="${i}" value="${c.max??""}"></label>
      <label class="f">Min order ₹<input type="number" data-cp="min" data-i="${i}" value="${c.min??""}"></label>
      <button class="btn sm danger" data-cpdel="${i}">Hatao</button></div>
      <div class="grid2"><label class="f">Offer ka text (English)<input type="text" data-cp="en" data-i="${i}" value="${esc(c.en)}"></label><label class="f">Offer ka text (Hindi)<input type="text" data-cp="hi" data-i="${i}" value="${esc(c.hi)}"></label></div></div>`).join("")}
    <div><button class="btn sm" id="cpAdd">+ Coupon jodo</button></div></div>
  <div class="card stack"><h3>Naye order ki khabar</h3><span class="muted small">Admin panel khula ho to naya order aate hi awaaz aati hai. Notification chalu karne par screen par bhi message aayega.</span>
    <div class="row">${np==="granted"?`<span class="pill tag-ok">Notification chalu hai</span>`:`<button class="btn sm" id="notifOn">${svg("bell")}Notification chalu karo</button>`}</div></div>
  <div class="card row between"><span class="small muted">Login: <b style="color:var(--ink)">${esc(user&&user.email)}</b></span><div class="row"><button class="btn sm" data-thm>Dark / light mode</button><button class="btn sm danger" data-logout>Logout</button></div></div>
  <div id="sMsg"></div>
  <div class="sticky-save"><button class="btn solid" id="sSave">Settings save karo</button></div></div>`;
  $("#settings").oninput=()=>{settingsDirty=true};
}
function readSettings(){
  const v=id=>$("#"+id).value.trim(), n=id=>Number($("#"+id).value)||0;
  Object.assign(SDRAFT,{phone:v("sPhone"),whatsapp:v("sWa").replace(/\D/g,""),email:v("sEmail"),hours_en:v("sHoursEn"),hours_hi:v("sHoursHi"),address:v("sAddr"),
    freeShipAbove:n("sFree"),shipping:n("sShip"),returnDays:n("sRet"),dispatchDays:v("sDisp"),deliveryDays:v("sDel"),
    firm:v("sFirm"),gstin:v("sGstin").toUpperCase(),invPrefix:v("sPre").toUpperCase()||"AE",hsnBags:v("sHsnB"),gstBags:n("sGstB"),hsnCovers:v("sHsnC"),gstCovers:n("sGstC")});
  document.querySelectorAll("[data-cp]").forEach(el=>{const c=SDRAFT.coupons[+el.dataset.i];const k=el.dataset.cp;c[k]=["value","max","min"].includes(k)?(Number(el.value)||0):(k==="code"?el.value.trim().toUpperCase():el.value.trim())});
}
async function saveSettings(){
  readSettings(); const m=$("#sMsg");
  if(SDRAFT.whatsapp&&!/^91\d{10}$/.test(SDRAFT.whatsapp)){m.className="msg bad";m.textContent="WhatsApp number 91 ke saath 12 ankon ka hona chahiye, jaise 919990602827.";return}
  SDRAFT.coupons=SDRAFT.coupons.filter(c=>c.code);
  const d={...SDRAFT}; delete d.lastInv; d.setupDone=true;
  try{await db.collection("store_settings").doc("main").set(d,{merge:true});settingsDirty=false;toast("Settings save ho gayi. Website par lag gayi.");m.className="msg ok";m.textContent="Save ho gaya. Website par turant lag gaya."}catch(e){m.className="msg bad";m.textContent=errText(e)}
}
trNode(document.body);
</script>

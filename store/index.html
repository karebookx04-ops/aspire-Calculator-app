<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Aspire Enterprises Store</title>
<meta name="description" content="Laptop bags, hand bags, washing machine covers and AC covers, factory direct from Aspire Enterprises, New Delhi. Cash on delivery and GST invoice on every order.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111'/%3E%3Cpath d='M14 84 L46 20 H62 L30 84 Z' fill='%23F6F2EA'/%3E%3Cpath d='M54 54 L63 36 L88 84 H70 Z' fill='%23FF4D1A'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* Layout: storefront with sticky search header; slanted "blade" from the logo used as the brand motif; product art tiles on warm neutral */
:root{
  --bg:#F6F2EA; --surface:#FFFFFF; --ink:#111111; --muted:#5E5A53; --line:#E4DDD1;
  --orange:#FF4D1A; --orange-ink:#C2360D; --tile:#EEE7DB; --band:#111111; --band-fg:#F6F2EA; --good:#1E7A46;
  --display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131211; --surface:#1C1A18; --ink:#F6F2EA; --muted:#B0A99E; --line:#33302B;
  --orange:#FF5E2E; --orange-ink:#FF8D66; --tile:#252220; --band:#0A0908; --band-fg:#F6F2EA; --good:#5BC88A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131211; --surface:#1C1A18; --ink:#F6F2EA; --muted:#B0A99E; --line:#33302B;
  --orange:#FF5E2E; --orange-ink:#FF8D66; --tile:#252220; --band:#0A0908; --band-fg:#F6F2EA; --good:#5BC88A; color-scheme:dark}

*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(24px,3.4vw,34px);font-weight:800}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-ink)}
.muted{color:var(--muted)}
.rs{font-variant-numeric:tabular-nums}

/* notice + header */
.notice{background:var(--band);color:var(--band-fg);font-size:13px;text-align:center;padding-block:8px}
.notice b{color:var(--orange)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:20px;padding-block:12px}
.logo{display:block;width:150px;height:auto;flex:none}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:0 6px 0 16px;min-width:0;max-width:520px}
.search:focus-within{border-color:var(--orange)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;font:inherit;color:var(--ink);outline:none}
.search button{border:0;background:var(--ink);color:var(--bg);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.hlinks{display:flex;align-items:center;gap:6px;margin-left:auto}
.hlink{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;font-weight:600;font-size:14.5px;cursor:pointer;background:none;border:0}
.hlink:hover{background:var(--bg)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:#111;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.cats{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats a{white-space:nowrap;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.cats a:hover{color:var(--ink);background:var(--bg)}
.cats a.on{background:var(--ink);color:var(--bg)}
@media (max-width:760px){
  .hbar{flex-wrap:wrap;gap:10px 12px}.logo{width:124px}
  .search{order:3;flex-basis:100%;max-width:none}
  .hlink .lbl{display:none}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--body);padding:14px 22px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:transform .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn.solid{background:var(--orange);border-color:var(--orange);color:#111}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;padding-block:24px}
.hero-main{background:var(--band);color:var(--band-fg);border-radius:20px;padding:clamp(28px,5vw,56px);position:relative;overflow:hidden;min-height:340px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.hero-main h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;max-width:12ch;position:relative}
.hero-main h1 em{color:var(--orange);font-style:italic}
.hero-main p{color:#BDB6AB;max-width:40ch;position:relative}
.hero-main .eyebrow{color:var(--orange);position:relative}
.hero-main .btns{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.hero-main .btn:not(.solid){border-color:#F6F2EA;color:#F6F2EA}
.hero-blade{position:absolute;right:-40px;bottom:-30px;width:min(52%,360px);opacity:.95}
.hero-side{display:grid;gap:20px}
.promo{border-radius:20px;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:12px;overflow:hidden;cursor:pointer}
.promo h3{font-size:24px;font-weight:800}
.promo p{font-size:14px;margin-top:6px}
.promo svg{width:110px;height:auto;flex:none}
.promo.o{background:var(--orange);color:#111}
.promo.o p{color:#3A1D10}
.promo.c{background:var(--tile)}
.promo.c p{color:var(--muted)}
@media (max-width:860px){.hero{grid-template-columns:1fr}.hero-main{min-height:300px}.hero-blade{width:46%;opacity:.35}}

/* trust strip */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-block:8px 8px}
.trust div{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:14px;min-width:0}
.trust b{display:block;font-size:14.5px}
.trust span{color:var(--muted);font-size:13px}
.ico{width:38px;height:38px;border-radius:10px;background:color-mix(in srgb,var(--orange) 14%,transparent);display:grid;place-items:center;flex:none;color:var(--orange-ink)}
@media (max-width:900px){.trust{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.trust{grid-template-columns:1fr}}

/* sections */
.sec{padding-block:40px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head > div{display:grid;gap:6px}
.link{font-weight:600;color:var(--orange-ink);font-size:14.5px}
.link:hover{text-decoration:underline}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s;min-width:0}
.pc:hover{box-shadow:0 10px 28px rgb(0 0 0 / .08);transform:translateY(-2px)}
.pc .art{aspect-ratio:1/1;background:var(--tile);display:grid;place-items:center;position:relative;overflow:hidden}
.pc .art svg{width:62%;height:auto}
.tag{position:absolute;z-index:1;left:10px;top:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--orange);color:#111}
.pc .info{padding:12px 14px 14px;display:grid;gap:4px;flex:1}
.pc .cat{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pc h3{font-size:16px;font-weight:600;font-family:var(--body);line-height:1.3}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:4px}
.price b{font-family:var(--display);font-size:19px;font-weight:700}
.price s{color:var(--muted);font-size:13.5px}
.price .off{color:var(--good);font-size:13px;font-weight:600}
.pc .add{margin:0 14px 14px;padding:11px;border-radius:10px;font-size:14px}
.rating{font-size:12.5px;color:var(--muted)}

/* category tiles */
.ctiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ctile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;align-items:center;gap:14px;min-width:0}
.ctile:hover{border-color:var(--ink)}
.ctile .mini{width:64px;height:64px;border-radius:12px;background:var(--tile);display:grid;place-items:center;flex:none}
.ctile .mini svg{width:70%}
.ctile b{display:block;font-family:var(--display);font-size:17px}
.ctile span{color:var(--muted);font-size:13px}
.ctile.soon{border-style:dashed;cursor:default}
@media (max-width:900px){.ctiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.ctiles{grid-template-columns:1fr}}

/* shop page */
.shopbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.empty{padding:48px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);display:grid;gap:12px;justify-items:center}

/* product page */
.crumbs{font-size:13.5px;color:var(--muted);padding-block:18px 8px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a:hover{color:var(--ink)}
.pd{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;padding-bottom:40px;align-items:start}
.pd-art{background:var(--tile);border-radius:20px;aspect-ratio:1/1;display:grid;place-items:center;position:relative;max-width:100%;overflow:hidden}
.pd-art svg{width:58%}
.pd-art .ph{position:absolute;bottom:14px;left:14px;font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);padding:5px 10px;border-radius:8px}
.pd-info{display:grid;gap:18px;min-width:0}
.pd-info h1{font-size:clamp(26px,3.4vw,36px);font-weight:800}
.pd-info .price b{font-size:30px}
.opt{display:grid;gap:10px}
.opt label,.opt .lbl{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
.sw.on{outline:2.5px solid var(--ink);outline-offset:2px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sz{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer}
.sz.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.qty button{width:42px;height:46px;border:0;background:transparent;font-size:20px;cursor:pointer}
.qty span{min-width:36px;text-align:center;font-weight:700}
.buyrow{display:flex;gap:10px;flex-wrap:wrap}
.buyrow .btn{flex:1;min-width:150px}
.points{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.points li{display:flex;gap:10px;font-size:15px}
.points li::before{content:"";width:8px;height:8px;margin-top:8px;flex:none;background:var(--orange);transform:skewX(-20deg)}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.perks div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;color:var(--muted)}
.perks b{display:block;color:var(--ink);font-size:14px}
@media (max-width:860px){.pd{grid-template-columns:1fr;gap:24px}.pd-art{max-width:520px;width:100%}}
@media (max-width:460px){.perks{grid-template-columns:1fr}}

/* cart + checkout */
.two{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start;padding-block:24px 48px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.ci{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.ci .thumb{width:84px;height:84px;border-radius:12px;background:var(--tile);display:grid;place-items:center}
.ci .thumb svg{width:66%}
.ci h3{font-size:15.5px;font-family:var(--body);font-weight:600}
.ci .meta{font-size:13px;color:var(--muted)}
.ci .right{display:grid;justify-items:end;gap:8px}
.ci .qty button{width:34px;height:36px;font-size:17px}
.rm{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
@media (max-width:520px){.ci{grid-template-columns:64px 1fr}.ci .thumb{width:64px;height:64px}.ci .right{grid-column:1/-1;grid-template-columns:auto auto auto;justify-content:space-between;align-items:center;width:100%}}
.sum{display:grid;gap:10px;position:sticky;top:150px}
.sum .row{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.sum .total{border-top:1px solid var(--line);padding-top:12px;font-weight:700;font-size:18px}
.sum .note{font-size:12.5px;color:var(--muted)}
form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.f2{grid-template-columns:1fr}}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:13.5px;font-weight:600}
.field input,.field textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--orange);outline:none}
.field .err{color:#C62828;font-size:12.5px}
.pay{display:grid;gap:10px}
.payopt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.payopt:has(input:checked){border-color:var(--ink)}
.payopt input{margin-top:4px;accent-color:var(--orange)}
.payopt small{display:block;color:var(--muted)}
.done{display:grid;gap:16px;max-width:680px;margin:32px auto 56px;text-align:left}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--good);display:grid;place-items:center;color:#fff}
pre.order{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0;overflow-x:auto}

/* about/contact */
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:24px}
.about .panel p{color:var(--muted);margin-top:10px}
dl.biz{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:0}
dl.biz dt,dl.biz dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
dl.biz dt{color:var(--muted);padding-right:16px}
dl.biz dd{font-weight:600;overflow-wrap:anywhere}
.todo{display:inline-block;font-size:12px;font-weight:600;border:1.5px dashed var(--orange-ink);color:var(--orange-ink);padding:2px 9px;border-radius:999px}
@media (max-width:860px){.about{grid-template-columns:1fr}}

footer{background:var(--band);color:#B5AEA3;font-size:14px;margin-top:24px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;padding-block:44px 28px}
.fgrid h4{color:#F6F2EA;font-family:var(--display);font-size:15px;margin:0 0 12px}
.fgrid a{display:block;padding-block:4px}
.fgrid a:hover{color:#F6F2EA}
.flogo{--ink:#F6F2EA;--muted:#B5AEA3;width:150px;margin-bottom:12px}
.fbot{border-top:1px solid #2C2925;padding-block:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
@media (max-width:760px){.fgrid{grid-template-columns:1fr 1fr}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14.5px;display:flex;gap:14px;align-items:center;z-index:40;transition:transform .25s ease,visibility .25s;max-width:calc(100% - 32px);white-space:nowrap;visibility:hidden}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast a{color:var(--orange);text-decoration:underline}

/* ---- v5 additions ---- */
:lang(hi) body, :lang(hi) .btn{font-family:"Inter","Noto Sans Devanagari",system-ui,sans-serif}
:lang(hi) h1,:lang(hi) h2,:lang(hi) h3,:lang(hi) .price b{font-family:"Outfit","Noto Sans Devanagari",system-ui,sans-serif}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--ink);color:var(--bg)}
.heart{position:absolute;right:10px;top:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgb(0 0 0 / .1);color:var(--ink)}
.heart.on{color:var(--orange)}
.heart.on svg{fill:currentColor}
.offer-strip{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px dashed var(--orange);border-radius:var(--r);padding:16px 20px;background:color-mix(in srgb,var(--orange) 8%,var(--surface))}
.offer-strip b{font-family:var(--display);font-size:20px}
.code{font:700 14px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs button{width:72px;height:72px;border-radius:12px;overflow:hidden;border:2px solid var(--line);padding:0;cursor:pointer;background:var(--tile)}
.thumbs button.on{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
details.sg{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.sg summary{padding:14px 16px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
details.sg .in{padding:0 16px 16px;display:grid;gap:10px;font-size:14px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wa-ask{border-color:#1E9E55;color:#1E9E55}
.wa-float{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:35;width:56px;height:56px;border-radius:50%;background:#1E9E55;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.reviews{display:grid;gap:12px}
.rv{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);display:grid;gap:6px}
.stars{color:var(--orange);letter-spacing:2px}
.ship-bar{display:grid;gap:6px;font-size:13.5px}
.ship-bar .track{height:8px;border-radius:4px;background:var(--tile);overflow:hidden}
.ship-bar .fill{height:100%;background:var(--good)}
.coupon{display:flex;gap:8px}
.coupon input{flex:1;min-width:0;font:inherit;text-transform:uppercase;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.coupon button{padding:10px 14px;border-radius:10px}
.cmsg{font-size:13px}
.cmsg.ok{color:var(--good)}.cmsg.bad{color:#C62828}
.doc{max-width:760px;padding-bottom:48px}
.doc h2{margin-bottom:14px}
.doc h3{font-size:18px;margin:22px 0 8px}
.doc p,.doc li{color:var(--muted);font-size:15.5px}
.doc ul{padding-left:20px;margin:6px 0;display:grid;gap:6px}
.doc .upd{font-size:13px;color:var(--muted)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{padding:16px 0;font-weight:600;font-size:16px;cursor:pointer}
.faq details p{padding-bottom:16px;color:var(--muted)}
.pol-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pc .art:has(img),.pd-art:has(img),.thumb:has(img){background:#F6F2EA}
.search{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgb(0 0 0 / .14);z-index:25;overflow:hidden;max-height:min(70vh,440px);overflow-y:auto}
.sugg a{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:8px 12px;font-size:14px}
.sugg a:hover,.sugg a.on{background:var(--bg)}
.sugg .st{width:44px;height:44px;border-radius:8px;overflow:hidden;background:#F6F2EA;display:grid;place-items:center}
.sugg .st svg{width:70%}
.sugg .sn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sugg .sp{font-weight:700;font-variant-numeric:tabular-nums}
.sugg .sall{display:block;text-align:center;padding:10px;font-weight:600;color:var(--orange-ink);border-top:1px solid var(--line);grid-template-columns:none}
.buybar{display:none}
@media (max-width:860px){
  .buybar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:34;gap:10px;align-items:center;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgb(0 0 0 / .08);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .buybar .bp{display:grid;line-height:1.15;flex:none}
  .buybar .bp b{font-family:var(--display);font-size:19px}
  .buybar .bp s{font-size:12px;color:var(--muted)}
  .buybar .btn{flex:1;padding:13px 10px;font-size:14.5px;min-width:0}
  body.has-buybar{padding-bottom:76px}
  body.has-buybar .wa-float{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  body.has-buybar .toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
}
.ordid{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.ordid b{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:6px 10px;border-radius:8px}
.saved-note{font-size:13px;color:var(--good)}
@media (max-width:760px){.hlinks{gap:0}.hlink{padding:8px 5px;gap:4px}.lang button{padding:6px 8px}.hbar .logo{width:104px}.hbar{gap:10px 8px}}

const smallOf=ph=>ph.startsWith("photos/")&&!ph.startsWith("photos/sm/")?ph.replace("photos/","photos/sm/"):ph;
function normP(p){
  if(!p.images||!p.images.length) p.images=[p.photo,...(p.more_photos||[])].filter(Boolean).map(f=>({t:smallOf(f),f}));
  p.colours=(p.colours||[]).map(c=>Array.isArray(c)?c:[c.n,c.c||"#7A7F86"]).filter(c=>c[0]); if(!p.colours.length) delete p.colours;
  if(p.size_guide&&p.size_guide.rows) p.size_guide.rows=p.size_guide.rows.map(r=>Array.isArray(r)?r:String(r).split("|").map(x=>x.trim()));
  if(p.size_guide&&(!p.size_guide.cols||!p.size_guide.rows||!p.size_guide.rows.length)) p.size_guide=null;
  if(p.sizes&&!p.sizes.length) delete p.sizes;
  return p;
}
const FULL={};
function fullOf(im){
  if(!im) return "";
  if(im.f&&im.f.startsWith("ph:")){const id=im.f.slice(3); if(FULL[id]) return FULL[id]; loadFull(id); return im.t;}
  return im.f||im.t;
}
async function loadFull(id){
  if(loadFull[id]) return; loadFull[id]=1;
  const d=await restGet("store_photos/"+id).catch(()=>null);
  if(d&&d.d){FULL[id]=d.d; document.querySelectorAll(`img[data-full="${id}"]`).forEach(el=>el.src=d.d)}
}
function pic(p,colIdx,im,big){
  const col=p.colours?p.colours[colIdx||0]:null;
  im=im||(p.images||[])[0];
  if(!im) return art(p.art,col?col[1]:"#1A1A1A");
  const src=big?fullOf(im):(im.t||im.f);
  const fb=!big&&im.f&&!im.f.startsWith("ph:")&&im.f!==src?`onerror="this.onerror=null;this.src='${im.f}'"`:"";
  const dfull=big&&im.f&&im.f.startsWith("ph:")?`data-full="${im.f.slice(3)}"`:"";
  return `<img src="${src}" ${fb} ${dfull} alt="${esc(pn(p))}" ${big?'fetchpriority="high"':'loading="lazy"'} decoding="async" width="1000" height="1000" style="width:100%;height:100%;object-fit:cover">`;
}
function oos(p){return !!p&&typeof p.stock==="number"&&p.stock<=0}
function addToCart(id,colour,size,qty){
  const p=pById(id); if(oos(p)){toast(t("oos"));return} colour=colour||(p.colours?p.colours[0][0]:""); size=size||(p.sizes?p.sizes[0]:"");
  const ex=cart.find(i=>i.id===id&&i.colour===colour&&i.size===size);
  if(ex) ex.qty=Math.min(99,ex.qty+(qty||1)); else cart.push({id,colour,size,qty:qty||1});
  save(); toast(`${t("added")} <a href="#cart">${t("viewCart")}</a>`);
}
function toggleWish(id){const i=wish.indexOf(id);if(i>=0){wish.splice(i,1);toast(t("wishRm"))}else{wish.push(id);toast(`${t("wishAdd")} <a href="#wishlist">${t("wish")}</a>`)}save();
  document.querySelectorAll(`[data-wish="${id}"]`).forEach(b=>{b.classList.toggle("on",wish.includes(id));b.setAttribute("aria-pressed",wish.includes(id))})}
function couponCheck(sub){
  if(!couponCode) return {amt:0};
  const c=COUPONS.find(x=>x.code===couponCode); if(!c) return {amt:0,err:t("cBad")};
  if(sub<c.min) return {amt:0,err:t("cMin",{x:rs(c.min)}),c};
  const amt=c.type==="pct"?Math.min(Math.round(sub*c.value/100),c.max||Infinity):c.value;
  return {amt:Math.min(amt,sub),c};
}
function totals(){
  const sub=cart.reduce((a,i)=>a+pById(i.id).price*i.qty,0);
  const mrp=cart.reduce((a,i)=>a+pById(i.id).mrp*i.qty,0);
  const cp=couponCheck(sub);
  const ship=sub===0||sub>=STORE.freeShipAbove?0:STORE.shipping;
  return {sub,mrp,ship,cp,total:sub-cp.amt+ship,save:mrp-sub};
}

function stars(n){return "★★★★★".slice(0,Math.round(n))+"☆☆☆☆☆".slice(0,5-Math.round(n))}
function avg(id){const r=revs(pById(id));return r.length?r.reduce((a,x)=>a+x.stars,0)/r.length:0}

function shop(){
  const f=shopFilter;
  let list=PRODUCTS.filter(p=>(f.cat==="all"||p.cat===f.cat)&&(f.type==="all"||p.type===f.type));
  if(f.q){const q=f.q.toLowerCase();list=list.filter(p=>(p.name+" "+p.type+" "+p.cat+" "+pn(p)+" "+pt(p)).toLowerCase().includes(q))}
  if(f.sort==="low") list=[...list].sort((a,b)=>a.price-b.price);
  if(f.sort==="high") list=[...list].sort((a,b)=>b.price-a.price);
  if(f.sort==="off") list=[...list].sort((a,b)=>off(b)-off(a));
  const types=[...new Set(PRODUCTS.filter(p=>f.cat==="all"||p.cat===f.cat).map(p=>p.type))];
  const title=f.q?t("results",{q:esc(f.q)}):f.type!=="all"?ptype(f.type):f.cat!=="all"?catn(f.cat):t("all");
  return `<div class="wrap">${crumbs(`<span>${title}</span>`)}
  <div class="sec-head" style="margin-bottom:14px"><div><h2>${title}</h2><span class="muted rs">${t("nProducts",{n:list.length})}</span></div></div>
  <div class="shopbar">

      ${types.map(x=>`<button class="chip ${f.type===x?"on":""}" data-type="${esc(x)}">${esc(ptype(x))}</button>`).join("")}

  else if(h.startsWith("p-")) html=product(h.slice(2));

const FB={apiKey:"AIzaSyDs02UCwfUIYyhcenCaA6QJSiN78ZJeSf0",projectId:"aspire-app-9e294"};
const FSURL=`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
function dec(v){
  if("stringValue" in v) return v.stringValue;
  if("integerValue" in v) return Number(v.integerValue);
  if("doubleValue" in v) return Number(v.doubleValue);
  if("booleanValue" in v) return v.booleanValue;
  if("timestampValue" in v) return v.timestampValue;
  if("arrayValue" in v) return (v.arrayValue.values||[]).map(dec);
  if("mapValue" in v) return decF(v.mapValue.fields||{});
  return null;
}
function decF(f){const o={};for(const k in f)o[k]=dec(f[k]);return o}
function enc(x){
  if(x===null||x===undefined) return {nullValue:null};
  if(x instanceof Date) return {timestampValue:x.toISOString()};
  if(Array.isArray(x)) return {arrayValue:{values:x.map(enc)}};
  if(typeof x==="string") return {stringValue:x};
  if(typeof x==="number") return Number.isInteger(x)?{integerValue:String(x)}:{doubleValue:x};
  if(typeof x==="boolean") return {booleanValue:x};
  return {mapValue:{fields:encF(x)}};
}
function encF(o){const f={};for(const k in o)f[k]=enc(o[k]);return f}
async function restGet(path){
  const r=await fetch(`${FSURL}/${path}?key=${FB.apiKey}`); if(r.status===404) return null;
  if(!r.ok) throw new Error(r.status); const j=await r.json(); return decF(j.fields||{});
}
async function restList(col){
  const r=await fetch(`${FSURL}/${col}?pageSize=300&key=${FB.apiKey}`); if(!r.ok) throw new Error(r.status);
  const j=await r.json(); return (j.documents||[]).map(d=>({...decF(d.fields||{}),id:d.name.split("/").pop()}));
}
async function restCreate(col,obj){
  const r=await fetch(`${FSURL}/${col}?key=${FB.apiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:encF(obj)})});
  if(!r.ok) throw new Error(r.status); return r.json();
}
function applyRemote(data){
  if(!data) return;
  if(data.products&&data.products.length){
    const list=data.products.filter(p=>p.active!==false&&p.name&&p.price).sort((a,b)=>(a.order??999)-(b.order??999)).map(normP);
    PRODUCTS.splice(0,PRODUCTS.length,...list);
  }
  const st=data.settings;
  if(st){
    ["phone","whatsapp","email","address","hours_en","hours_hi","dispatchDays","deliveryDays"].forEach(k=>{if(st[k]!==undefined&&st[k]!=="")STORE[k]=st[k]});
    ["freeShipAbove","shipping","returnDays"].forEach(k=>{if(typeof st[k]==="number")STORE[k]=st[k]});
    if(Array.isArray(st.coupons)) COUPONS.splice(0,COUPONS.length,...st.coupons.filter(c=>c.code));
  }
  cart=cart.filter(i=>pById(i.id)&&!oos(pById(i.id))); wish=wish.filter(pById); recent=recent.filter(pById);
}
async function loadRemote(){
  try{
    const [products,settings]=await Promise.all([restList("store_products"),restGet("store_settings/main")]);
    const data={products,settings}; store.set("aspire-remote",data);
    applyRemote(data); save();
    const h=location.hash.slice(1);
    if(h!=="checkout"&&h!=="order-placed"){const y=scrollY; render(true); scrollTo(0,y)}
  }catch(e){ /* offline or rules not set yet: keep the built-in products */ }
}

PRODUCTS.forEach(normP);
applyRemote(store.get("aspire-remote",null));
save(); render(); loadRemote();
